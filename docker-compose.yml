name: home-ai-system
x-backend: &backend
  build: ./backend
  env_file: .env
  volumes:
    - appdata:/data
  restart: unless-stopped
  networks: [private]

services:
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    command: ["uvicorn", "homeai.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
  mcp-foxess:
    <<: *backend
    command: ["python", "-m", "homeai.mcp.foxess"]
    expose: ["8101"]
  mcp-octopus:
    <<: *backend
    command: ["python", "-m", "homeai.mcp.octopus"]
    expose: ["8102"]
  mcp-unifi:
    <<: *backend
    command: ["python", "-m", "homeai.mcp.unifi"]
    expose: ["8103"]
  mcp-optimiser:
    <<: *backend
    command: ["python", "-m", "homeai.mcp.optimiser"]
    expose: ["8104"]
  webhook-gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend/webhook-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${WEBHOOK_BIND_IP:-127.0.0.1}:8088:80"]
    networks: [private]
    depends_on: [api]
  dashboard:
    build: ./frontend
    restart: unless-stopped
    ports: ["${DASHBOARD_BIND_IP:-127.0.0.1}:5173:80"]
    networks: [private]
    depends_on: [api]

networks:
  private:
    internal: false

volumes:
  appdata:
